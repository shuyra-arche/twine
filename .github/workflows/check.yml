name: Native communication
on:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install declared toolchain
        run: rustup show
      - name: Format, host contracts and RV64 builds
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --target x86_64-unknown-linux-gnu
          cargo build --locked --target riscv64gc-unknown-none-elf
          cargo build --locked --release --target riscv64gc-unknown-none-elf
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    env:
      QEMU_RISCV64: qemu-system-riscv64
      QEMU_OPENSBI: /usr/lib/riscv64-linux-gnu/opensbi/generic/fw_dynamic.bin
    steps:
      - name: Install image tools
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates curl gcc git libc6-dev opensbi python3 qemu-system-misc
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install declared guest and platform compilers
        run: |
          rustup show
          rustup toolchain install nightly-2026-11-14 --profile minimal --target riscv64gc-unknown-none-elf
      - name: Native communication in both profiles
        run: |
          python3 tests/target/share/run.py
          python3 tests/target/share/run.py --profile debug
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-communication
          path: tests/target/share/target/evidence/
          if-no-files-found: error
