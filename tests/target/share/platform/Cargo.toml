[package]
name = "twine-test-platform"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "twine-test-platform"
path = "main.rs"
test = false
bench = false

[dependencies]
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "684f479c45dc2d94d405b32b4ffc6334a4233fc9" }
kernel = { git = "https://github.com/shuyra-arche/kernel.git", rev = "684f479c45dc2d94d405b32b4ffc6334a4233fc9" }
spin = { version = "0.10", default-features = false, features = ["once"] }
fdt = { version = "0.1.5", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
