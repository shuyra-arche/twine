[package]
name = "twine-share-guest"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "twine-share-guest"
path = "main.rs"

[dependencies]
twine = { path = "../../.." }
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "789ffd19b5359f3de172fb9aad8a61f6a7113a64" }
kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "789ffd19b5359f3de172fb9aad8a61f6a7113a64" }

weave = { git = "https://github.com/shuyra-arche/weave.git", rev = "671220b53c44187160eae27b581f4a900e22ec01", default-features = false }

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
